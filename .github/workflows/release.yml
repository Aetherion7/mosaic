name: Release desktop apps

# Baut die Windows-/macOS-/Linux-Desktop-App und veröffentlicht sie als
# GitHub Release, sobald ein Tag wie "v1.2.0" gepusht wird:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Jede der drei Plattformen wird auf ihrem jeweils "echten" Runner gebaut
# (macos-latest für den Mac-Build usw.) — Cross-Compiling für macOS/Windows
# von Linux aus ist zwar teilweise möglich, aber unzuverlässig, besonders für
# code-signierte Builds. electron-updater (electron/main.js) prüft bei jedem
# App-Start automatisch gegen die neuesten GitHub-Releases-Assets — ein neues
# Release hier reicht, alle drei Plattformen ziehen sich das Update selbst.
#
# Zwei Jobs statt einem: jede Matrix-Plattform baut nur (--publish never) und
# lädt ihr Ergebnis als Artifact hoch; ein einzelner Folge-Job sammelt alle
# drei Artifacts ein und erstellt EIN GitHub-Release daraus. Vorher rief
# jede Plattform parallel "electron-builder --publish always" auf und alle
# drei versuchten gleichzeitig, dasselbe Release-Objekt anzulegen/zu
# aktualisieren — ein bekanntes electron-builder-Problem bei Matrix-Builds,
# das dazu führte, dass Jobs als "erfolgreich" durchliefen, das Release aber
# leer oder unsichtbar blieb.
#
# Ohne Code-Signing-Zertifikate (siehe unten) sind die Builds funktionsfähig,
# aber Windows SmartScreen / macOS Gatekeeper warnen beim ersten Start vor
# "unbekanntem Herausgeber" — das ist normal für unsignierte Builds und kein
# Fehler in diesem Workflow. Siehe GITHUB_SETUP.md → "Code-Signing (optional)".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: cd electron && npm ci --omit=dev

      - name: Build (${{ matrix.os }})
        shell: bash
        run: |
          # electron-builder checks these env vars with `== null`, which an
          # EMPTY STRING does not satisfy — and GitHub Actions sets a secret
          # that doesn't exist to "" rather than omitting the var entirely.
          # Left as "CSC_LINK=''", electron-builder still thinks a cert is
          # configured and tries to import it, resolving the empty path to
          # the project root ("$GITHUB_WORKSPACE not a file"). Unset whichever
          # of these come through empty so the "no certificate" path is only
          # taken when it's actually true.
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
          [ -z "$WIN_CSC_LINK" ] && unset WIN_CSC_LINK
          [ -z "$WIN_CSC_KEY_PASSWORD" ] && unset WIN_CSC_KEY_PASSWORD
          npm run electron:ci-build
        env:
          # Optionale Code-Signing-Zertifikate — wirken nur, wenn die Secrets
          # gesetzt sind (sonst baut electron-builder unsigniert).
          # macOS:   CSC_LINK / CSC_KEY_PASSWORD (Apple Developer ID .p12)
          # Windows: WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (Code-Signing .pfx)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Ohne CSC_LINK versucht electron-builder auf macOS trotzdem, eine
          # Signing-Identität aus dem (leeren) CI-Keychain aufzulösen, sobald
          # mac.hardenedRuntime aktiv ist. Explizit deaktivieren, solange kein
          # echtes Zertifikat hinterlegt ist; sobald CSC_LINK gesetzt wird,
          # verwendet electron-builder ohnehin direkt dieses Zertifikat.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    # Läuft auch, wenn eine einzelne Plattform in der Matrix oben fehlschlägt
    # (fail-fast: false lässt die anderen ohnehin weiterlaufen) — die anderen
    # zwei Installer sollen trotzdem veröffentlicht werden, statt dass ein
    # einzelner kaputter Build (z. B. macOS) das ganze Release blockiert.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          fail_on_unmatched_files: true
          # Auto-generated "What's Changed" body — electron-updater reads this
          # release's notes and the in-app update popup (electron/main.js,
          # UpdateAvailablePopup.tsx) shows them as a bullet list, so every
          # release needs a body without anyone writing one by hand.
          generate_release_notes: true
          files: dist/*
