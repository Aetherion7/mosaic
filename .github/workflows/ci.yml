name: CI

# Läuft bei jedem Push und jeder PR gegen main: Typecheck, Lint, Tests, und ein
# echter Produktions-Build (fängt Next.js-Build-Fehler ab, die tsc/vitest
# allein nicht sehen). Kein Deploy hier — nur "funktioniert der Code".
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
