name: Test build

# Unveröffentlichte Testbuilds der Desktop-App: läuft bei jedem Push auf einen
# claude/**-Branch (oder manuell) und legt die Installer nur als Actions-
# Artefakte ab — kein GitHub-Release, kein Auto-Update an Nutzer:innen.
# Herunterladen: Actions → "Test build" → Lauf öffnen → Artifacts.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: cd electron && npm ci --omit=dev

      - name: Build (${{ matrix.os }})
        shell: bash
        run: npm run electron:ci-build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-test-${{ matrix.os }}
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
